services:
  backend:
    image: deveshpandi0202/grocerapp-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: grocerapp-backend
    restart: unless-stopped
    environment:
      - PORT=5000
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-grocerapp-jwt-secret-key-change-in-production-2024}
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/data/blinkit.db}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
    volumes:
      - backend-data:/app/data
    expose:
      - "5000"

  frontend:
    image: deveshpandi0202/grocerapp-frontend:latest
    build:
      context: ./my-react-app
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
        - VITE_BASE_PATH=/
    container_name: grocerapp-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"

volumes:
  backend-data:
