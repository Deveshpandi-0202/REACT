# Quick start for clients - pulls pre-built images from Docker Hub
# Usage:  docker compose -f docker-compose.pull.yml up -d
# Then open:  http://localhost:8080
services:
  backend:
    image: deveshpandi0202/grocerapp-backend:latest
    container_name: grocerapp-backend
    restart: unless-stopped
    environment:
      - PORT=5000
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-grocerapp-jwt-secret-key-change-in-production-2024}
      - SQLALCHEMY_DATABASE_URI=sqlite:////app/data/blinkit.db
    volumes:
      - backend-data:/app/data
    expose:
      - "5000"

  frontend:
    image: deveshpandi0202/grocerapp-frontend:latest
    container_name: grocerapp-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"

volumes:
  backend-data:
